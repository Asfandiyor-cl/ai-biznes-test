<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Тест: ИИ в бизнесе</title><style>:root{--bg:#f4f7fb;--card:#fff;--ink:#1c2b3a;--muted:#5d6d7e;--line:#e4ebf3;--accent:#0f6e6b}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:820px;margin:0 auto;padding:24px 16px 64px}header{background:linear-gradient(135deg,#0c4f4c,#14918c);color:#fff;border-radius:18px;padding:28px 24px}h1{font-size:26px;line-height:1.25;margin:8px 0 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}input[type=text]{width:100%;border:1px solid #d5e0ea;border-radius:10px;padding:12px 14px;font-size:16px;margin-bottom:12px}button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer}button.secondary{background:#e8eef4;color:var(--ink)}button:disabled{opacity:.5}.progress{height:8px;background:#e7eef5;border-radius:99px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:var(--accent);width:0}.q-text{font-size:20px;line-height:1.35;margin:8px 0 16px}.opt{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}.opt.picked{border-color:var(--accent);background:#f3fbfa}.row{display:flex;gap:10px;justify-content:space-between}.score-big{font-size:42px;font-weight:800;color:var(--accent);margin:0}.note{color:var(--muted);font-size:14px}.ok{color:#1b7f4e}.no{color:#b42318}.result-box{background:#f7fafc;border:1px dashed #c9d6e2;border-radius:12px;padding:12px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px}.review{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}</style></head><body><div class="wrap"><header><div>Худжандский политехнический институт · Группа №3 · 2026</div><h1>Искусственный интеллект в бизнесе: автоматизация, прогнозирование и персонализация</h1><p>Тест по реферату: 20 вопросов с одним правильным вариантом.</p></header><section class="card" id="start"><label>Фамилия и имя</label><input id="name" type="text" placeholder="Например: Каримов Алишер"><label>Группа</label><input id="group" type="text" value="Группа №3"><button id="begin">Начать тест</button><p class="note">Ответы проверяются по тексту реферата. Можно вернуться назад до завершения.</p></section><section class="card" id="quiz" hidden><div id="qnum"></div><div class="progress"><div id="bar"></div></div><div class="q-text" id="qtext"></div><div id="options"></div><div class="row"><button class="secondary" id="prev" type="button">Назад</button><button id="next" type="button">Далее</button></div></section><section class="card" id="result" hidden><p class="score-big" id="score"></p><p id="grade"></p><p class="note" id="who"></p><div class="result-box" id="share"></div><div class="row"><button id="copy" type="button">Скопировать результат</button><button class="secondary" id="again" type="button">Пройти ещё раз</button></div><div id="review"></div></section></div><script>
const QUESTIONS = [
{q:"Что в реферате названо ключевым инструментом цифровой трансформации?",options:["Бумажный документооборот","Искусственный интеллект","Только базовые СУБД","Ручной учёт"],a:1,why:"Во введении ИИ назван ключевым инструментом цифровой трансформации."},
{q:"К какой модели управления переходит современный бизнес?",options:["К интуитивным решениям без данных","К data-driven моделям — управлению на основе данных","К отказу от аналитики","Только к бумажным приказам"],a:1,why:"Во введении: переход от традиционных методов к data-driven моделям."},
{q:"Какие три направления применения ИИ выделены как основные?",options:["Только чат-боты и роботы","Интеллектуальная автоматизация, прогнозирование и персонализация услуг","Бухгалтерия, охрана и столовая","Добыча сырья и архив"],a:1,why:"Это прямо указано во введении и в теме реферата."},
{q:"Почему ИИ перестал быть прерогативой только IT-гигантов?",options:["Из-за отказа от интернета","Благодаря облачным вычислениям и открытым моделям","Потому что ИИ больше не требует данных","Из-за запрета автоматизации"],a:1,why:"Во введении: облачные вычисления и открытые модели делают ИИ доступным ритейлу, производству, финансам и услугам."},
{q:"Чем характеризовалась корпоративная аналитика начала 2000-х?",options:["Прескриптивными решениями нейросетей","Описательной аналитикой: системы лишь констатировали факты прошлого","Квантовыми вычислениями","Полным отсутствием баз данных"],a:1,why:"Раздел 1: период описательной аналитики, например подсчёт продаж за квартал."},
{q:"К чему бизнес перешёл в 2010-х с развитием Big Data?",options:["К предиктивной, прогнозирующей аналитике","К отказу от прогнозов","Только к бумажным журналам","К запрету машинного обучения"],a:0,why:"В разделе 1: с Big Data бизнес перешёл к предиктивной аналитике."},
{q:"Что означает текущий этап прескриптивной аналитики?",options:["Системы только описывают прошлое","Нейросети не только прогнозируют, но и сами принимают решения","Решения принимает только директор вручную","Аналитика ограничена одной таблицей"],a:1,why:"Примеры: генерация текстов, одобрение кредитов, управление логистикой в реальном времени."},
{q:"Чем ограничена традиционная RPA?",options:["Она понимает любой контекст","Робот выполняет задачу только по жёсткому алгоритму «если А, сделай Б»","Она непрерывно самообучается","Она не умеет работать с таблицами"],a:1,why:"Так описана традиционная автоматизация в разделе 2."},
{q:"Какие данные обрабатывает интеллектуальная автоматизация?",options:["Только структурированные таблицы и формы","Неструктурированные: сканы, голос, видео, свободный текст","Только бумажные приказы","Только коды ошибок"],a:1,why:"Это отличие из сравнительной таблицы раздела 2."},
{q:"Как интеллектуальная автоматизация относится к ошибкам?",options:["Всегда останавливает процесс","Самостоятельно ищет решение и адаптируется","Требует полной переписки кода","Удаляет документ"],a:1,why:"В таблице: у ИИ — самостоятельный поиск решения и адаптация, у RPA — остановка."},
{q:"На сколько ИИ сокращает время обработки корпоративной документации?",options:["На 5–10%","На 70–80%","Время не меняется","Только на 1%"],a:1,why:"В разделе о документообороте и комплаенсе указано сокращение на 70–80%."},
{q:"Сколько времени рекрутеров высвобождают виртуальные ассистенты в HR?",options:["До 40%","100% всего штата","Не более 2%","Только время директора"],a:0,why:"Скрининг, анализ резюме и первичные интервью высвобождают до 40% времени рекрутеров."},
{q:"Какие переменные ИИ анализирует при управлении запасами?",options:["Только цвет упаковки","Сезонность, погоду, задержки поставок, геополитические новости и остатки","Только мнение кладовщика","Только курс одной валюты"],a:1,why:"Этот перечень приведён в разделе 3."},
{q:"Для чего ИИ применяется в финансовом секторе?",options:["Для печати банкнот","Для динамического скоринга и мгновенного Anti-Fraud","Чтобы отменить все кредиты","Только для SMS-рассылок"],a:1,why:"ИИ анализирует поведение на сайте и блокирует мошенничество в миллисекунды."},
{q:"Что такое предиктивное обслуживание оборудования?",options:["Ремонт только после поломки","Прогноз отказа узлов по телеметрии IoT за недели до поломки","Ежегодная замена всех станков без данных","Отключение датчиков"],a:1,why:"Датчики IoT собирают вибрацию и температуру, нейросети предсказывают поломку заранее."},
{q:"Что анализирует ИИ в агропромышленном комплексе?",options:["Спутниковые снимки, данные дронов и метеостанций","Только меню ресторанов","Только биржевые котировки","Бумажные журналы без датчиков"],a:0,why:"Так прогнозируют урожайность и рекомендуют время удобрений или полива."},
{q:"На сколько умные меню в HoReCa способны увеличить средний чек?",options:["На 1–2%","На 15–25% без дополнительного персонала","На 90–100%","Средний чек не меняется"],a:1,why:"Кейс «Умные меню в ресторанах»: рост среднего чека на 15–25%."},
{q:"Что такое programmatic advertising?",options:["Ручная расклейка объявлений","Алгоритмическая закупка рекламы: нейросеть выбирает креатив за доли секунды","Только телереклама","Рассылка бумажных писем"],a:1,why:"Раздел 5: система учитывает время, устройство, поисковые запросы и геопозицию."},
{q:"Чем чат-боты на больших языковых моделях отличаются от шаблонных?",options:["Отвечают только заготовками в рабочее время","Ведут осмысленный диалог и доводят до покупки 24/7","Не умеют консультировать","Работают только с живым менеджером"],a:1,why:"В разделе 5 LLM-боты консультируют и продают без живого менеджера круглосуточно."},
{q:"В чём проблема алгоритмической предвзятости?",options:["Сервер перегревается","ИИ, обученный на данных с дискриминацией, повторяет эти ошибки","У компании слишком мало рекламы","Облако всегда бесплатно"],a:1,why:"Раздел 6: историческая дискриминация, например при выдаче кредитов, воспроизводится алгоритмом."}
];
const startEl=document.getElementById('start'),quizEl=document.getElementById('quiz'),resultEl=document.getElementById('result');
let answers=[],step=0;
function gradeOf(s){return s>=18?'Отлично':s>=15?'Хорошо':s>=12?'Удовлетворительно':'Нужно повторить реферат';}
function render(){const item=QUESTIONS[step];document.getElementById('qnum').textContent='Вопрос '+(step+1)+' из '+QUESTIONS.length;document.getElementById('bar').style.width=(step/QUESTIONS.length*100)+'%';document.getElementById('qtext').textContent=item.q;const box=document.getElementById('options');box.innerHTML='';item.options.forEach((text,idx)=>{const label=document.createElement('label');label.className='opt'+(answers[step]===idx?' picked':'');const input=document.createElement('input');input.type='radio';input.name='opt';input.checked=answers[step]===idx;input.onchange=()=>{answers[step]=idx;render();};label.appendChild(input);label.appendChild(document.createTextNode(text));box.appendChild(label);});document.getElementById('prev').disabled=step===0;document.getElementById('next').textContent=step===QUESTIONS.length-1?'Завершить':'Далее';}
document.getElementById('begin').onclick=()=>{if(!document.getElementById('name').value.trim()){alert('Введите фамилию и имя');return;}answers=Array(QUESTIONS.length).fill(null);step=0;startEl.hidden=true;resultEl.hidden=true;quizEl.hidden=false;render();};
document.getElementById('prev').onclick=()=>{if(step>0){step--;render();}};
document.getElementById('next').onclick=()=>{if(answers[step]===null){alert('Выберите вариант');return;}if(step<QUESTIONS.length-1){step++;render();return;}finish();};
function finish(){let score=0;const lines=[];const review=document.getElementById('review');review.innerHTML='<h3>Разбор ответов</h3>';QUESTIONS.forEach((item,i)=>{const ok=answers[i]===item.a;if(ok)score++;const block=document.createElement('div');block.className='review';block.innerHTML='<strong>'+(i+1)+'. '+item.q+'</strong><br>'+(ok?"<span class='ok'>Верно.</span> ":"<span class='no'>Неверно.</span> Ваш ответ: "+item.options[answers[i]]+'<br>Правильно: '+item.options[item.a]+'<br>')+"<span class='note'>"+item.why+'</span>';review.appendChild(block);lines.push((i+1)+'. '+(ok?'верно':'неверно'));});const name=document.getElementById('name').value.trim();const group=document.getElementById('group').value.trim()||'группа не указана';const grade=gradeOf(score);document.getElementById('score').textContent=score+' / 20';document.getElementById('grade').textContent=grade;document.getElementById('who').textContent=name+' · '+group;document.getElementById('share').textContent=name+' ('+group+')\nТест: ИИ в бизнесе\nРезультат: '+score+' из 20 — '+grade+'\n'+lines.join('\n');quizEl.hidden=true;resultEl.hidden=false;}
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('share').textContent);document.getElementById('copy').textContent='Скопировано';}catch(e){alert('Скопируйте текст вручную');}};
document.getElementById('again').onclick=()=>{resultEl.hidden=true;startEl.hidden=false;document.getElementById('copy').textContent='Скопировать результат';};
</script></body></html>
